name: ORBITAL — Daily Universe Snapshot
on:
  push:
    paths:
      - '.github/workflows/orbital-daily.yml'
      - 'scripts/orbital_update_data.py'
  workflow_dispatch:
  schedule:
    # Weekdays at 5:20 PM in New York, with automatic DST handling.
    - cron: '20 17 * * 1-5'
      timezone: 'America/New_York'
permissions:
  contents: write
concurrency:
  group: orbital-daily-snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free research dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'yfinance>=0.2.60,<2' 'pandas>=2,<3'
      - name: Refresh holdings and market data
        env:
          ORBITAL_YF_MAX: '70'
        run: python scripts/orbital_update_data.py
      - name: Publish validated snapshot only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve the validated generated files across remote-state refreshes.
          # No force-push and no change to MARKET-DEX/VANTA source files.
          mkdir -p /tmp/orbital-snapshot
          cp data/orbital-market-universe.json /tmp/orbital-snapshot/
          cp data/orbital-company-metadata.json /tmp/orbital-snapshot/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/orbital-snapshot/orbital-market-universe.json data/
            cp /tmp/orbital-snapshot/orbital-company-metadata.json data/
            git add data/orbital-market-universe.json data/orbital-company-metadata.json
            if git diff --cached --quiet; then
              echo 'ORBITAL snapshot already current'
              exit 0
            fi
            git commit -m 'data: refresh ORBITAL market universe'
            if git push origin HEAD:main; then
              echo 'Published ORBITAL snapshot successfully'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'ORBITAL publication failed after safe retries' >&2
          exit 1
