name: ORBITAL — Daily Universe Snapshot
on:
  push:
    paths:
      - '.github/workflows/orbital-daily.yml'
      - 'scripts/orbital_update_data.py'
  workflow_dispatch:
  schedule:
    # 22:20 UTC = 5:20pm EST / 6:20pm EDT; NY-close postprocessing, not exactly 5pm local year-round.
    - cron: '20 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: orbital-daily-snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free research dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'yfinance>=0.2.60,<2' 'pandas>=2,<3'
      - name: Refresh holdings and market data
        env:
          ORBITAL_YF_MAX: '70'
        run: python scripts/orbital_update_data.py
      - name: Publish validated snapshot only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/orbital-market-universe.json data/orbital-company-metadata.json
          git diff --cached --quiet || (git commit -m 'data: refresh ORBITAL market universe' && git push)