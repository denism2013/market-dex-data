name: MARKET-DEX Daily Market Snapshot

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marketdex-pages-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get updater files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - name: Install data libraries
        run: pip install -r scripts/requirements.txt
      - name: Download daily market history
        env:
          MARKETDEX_TICKER: SPY
          MARKETDEX_BENCHMARK: QQQ
          MARKETDEX_PERIOD: 10y
        run: python scripts/update_market_dex.py
      - name: Prepare static market data website
        shell: bash
        run: |
          mkdir -p public/data
          cp data/latest.zip data/latest.json public/data/
          echo '<!doctype html><html><body><h1>MARKET-DEX Daily Snapshot</h1><p><a href="data/latest.zip">Download latest ZIP</a></p><p><a href="data/latest.json">Freshness metadata</a></p></body></html>' > public/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload daily snapshot to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish the latest dataset
        id: deployment
        uses: actions/deploy-pages@v4
